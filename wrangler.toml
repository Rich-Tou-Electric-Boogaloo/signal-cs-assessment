name = "signal-cs-assessment"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Keep variables set in the dashboard (e.g. ASSESSOR_PIN) when Workers Builds deploys.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# No id: Wrangler creates the KV namespace in the deploying account on first deploy.
[[kv_namespaces]]
binding = "RESULTS"

# Set the assessor PIN as a secret (never commit it):
#   npx wrangler secret put ASSESSOR_PIN
