<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>window.__SIGNAL_API__=true;</script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Signal Support Desk Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an agent workspace — dark nav bar on top, queue on the left, ticket in the middle, reference panel on the right; stacks on phones. */
:root{
  /* Signal brand palette: Insignia #0a172e (ink, header), Cobalt #0046b4 (actions), Star #ff5a00 (highlights), White. Square corners, Montserrat. */
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f2f5f8; --line:#e2e2e2; --fg:#1e1e1e; --muted:#475569;
  --nav:#0a172e; --nav-fg:#ffffff; --ink:#212934;
  --accent:#0046b4; --on-accent:#ffffff; --accent-ink:#0046b4; --accent-soft:#e6eefa; --hot:#ff5a00; --hot-ink:#c94600;
  --urgent:#cc3340; --urgent-soft:#fbe9ea; --high:#c94600; --high-soft:#fff1e8; --normal:#0046b4; --low:#475569;
  --ok:#0a7d4f; --ok-soft:#e1f4ec; --pick:#e6eefa; --r:2px;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a172e; --surface:#11213d; --surface-2:#172a4a; --line:#26395c; --fg:#eef2f7; --muted:#a3b1c6;
  --nav:#060f1f; --nav-fg:#ffffff; --ink:#eef2f7;
  --accent:#0046b4; --on-accent:#ffffff; --accent-ink:#7fa9f2; --accent-soft:#13305e; --hot:#ff5a00; --hot-ink:#ff8f52;
  --urgent:#f0707a; --urgent-soft:#3a1d27; --high:#ff8f52; --high-soft:#3a2516; --normal:#7fa9f2; --low:#a3b1c6;
  --ok:#3fc58e; --ok-soft:#123a32; --pick:#13305e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a172e; --surface:#11213d; --surface-2:#172a4a; --line:#26395c; --fg:#eef2f7; --muted:#a3b1c6;
  --nav:#060f1f; --nav-fg:#ffffff; --ink:#eef2f7;
  --accent:#0046b4; --on-accent:#ffffff; --accent-ink:#7fa9f2; --accent-soft:#13305e; --hot:#ff5a00; --hot-ink:#ff8f52;
  --urgent:#f0707a; --urgent-soft:#3a1d27; --high:#ff8f52; --high-soft:#3a2516; --normal:#7fa9f2; --low:#a3b1c6;
  --ok:#3fc58e; --ok-soft:#123a32; --pick:#13305e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-weight:700;color:var(--ink);letter-spacing:-.01em}
h1 em,h2 em{font-style:normal;color:var(--hot-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
*{box-sizing:border-box}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.85em;font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);color:var(--nav-fg);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center}
.logo-svg{display:block;height:40px;width:auto}
.wordmark{font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1;white-space:nowrap}

.brand small{display:block;font-weight:400;opacity:.75;font-size:12px;border-left:1px solid rgba(255,255,255,.3);padding-left:12px}
.topbar .spacer{flex:1}
.stage{font-size:13px;opacity:.85}
.timer{font-family:var(--f-mono);font-size:18px;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:var(--r);font-variant-numeric:tabular-nums}
.timer.warn{background:#cc3340;color:#fff}
.tb-btn{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--nav-fg);border-radius:var(--r);padding:5px 10px;font-size:13px}
.tb-btn:hover{background:rgba(255,255,255,.1)}

.wrap{padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:28px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--hot-ink)}
.eyebrow::after{content:"";display:block;width:32px;height:3px;background:var(--hot);margin-top:8px}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.brief .panel h3{display:flex;gap:10px;align-items:baseline}
.brief .num{font-family:var(--f-mono);color:var(--hot-ink);font-size:14px}
.brief ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.wide{grid-column:1/-1}
.ack{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.ack input{margin-top:4px;accent-color:var(--accent-ink);width:18px;height:18px}
.startbar{background:var(--nav);color:var(--nav-fg);padding:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.startbar h2{color:#fff}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.pinrow{display:flex;gap:8px;flex-wrap:wrap}
.pinrow input{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--surface-2);font-family:var(--f-mono);letter-spacing:.2em;width:160px}
.resp{display:flex;flex-direction:column;gap:12px}
.resp-item{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.resp-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.resp-line{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:12px}
.resp-line .label{text-transform:none;letter-spacing:0;font-size:13px}
.resp .good{color:var(--ok);font-weight:600}.resp .bad{color:var(--urgent);font-weight:600}
.resp-best{font-size:13px;margin-top:2px}
@media (max-width:760px){.resp-line{grid-template-columns:minmax(0,1fr);gap:2px}}
.copilot{margin:0 18px;border:1px solid var(--accent-ink);border-radius:var(--r);background:var(--accent-soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.copilot-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.copilot-badge{background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:var(--r)}
.copilot .text{white-space:pre-wrap}
.proof{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.proof-badge{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--surface-2);cursor:pointer;font-size:13px}
.proof-badge.sel{border-color:var(--urgent);background:var(--urgent-soft)}
.proof-badge canvas{width:100%;height:auto;display:block}
.proof-badge input{accent-color:var(--urgent);margin-right:6px}
.chip.bench{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:600}
.bench-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bench-mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--hot);border-radius:1px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.codebox{width:100%;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface-2);word-break:break-all;resize:vertical}
.err{color:var(--urgent);font-weight:600;font-size:14px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:600}
.btn{text-transform:none}
.btn:hover{border-color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:not(:disabled):hover{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}

/* start */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.intro .wide{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--surface-2);color:var(--fg)}
.field input::placeholder{color:var(--muted);opacity:1}

/* pills */
.pri{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:var(--r);border:1px solid currentColor}
.pri.Urgent{color:var(--urgent)} .pri.High{color:var(--high)} .pri.Normal{color:var(--normal)} .pri.Low{color:var(--low)}
.chip{font-size:12px;padding:1px 8px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.new{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:700}
.chip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}

/* triage */
.triage-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px;align-items:start}
.rank{font-family:var(--f-mono);font-size:20px;text-align:center;color:var(--accent-ink);padding-top:2px}
.tmain{min-width:0;display:flex;flex-direction:column;gap:4px}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tsubj{font-weight:600;background:none;border:0;padding:0;text-align:left}

.tbody{background:var(--surface-2);border-left:3px solid var(--line);padding:10px 12px;border-radius:0 6px 6px 0;margin-top:6px;max-width:75ch;white-space:pre-wrap}
.tctrl{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tctrl select{border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--surface-2)}
.tctrl select.unset{border-color:var(--high)}
.moves{display:flex;gap:6px}
.moves button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:4px 10px}
.moves button:disabled{opacity:.35;cursor:default}

/* work */
.desk{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:16px;align-items:start}
.queue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.queue h3{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between}
.qitem{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 14px}
.qitem:hover{background:var(--surface-2)}
.qitem.active{background:var(--pick);box-shadow:inset 3px 0 0 var(--accent-ink)}
.qitem .s{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .m{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.thead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.convo{padding:16px 18px;display:flex;gap:12px;border-bottom:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.msg{min-width:0;display:flex;flex-direction:column;gap:6px}
.msg .who{font-size:14px} .msg .who b{font-weight:700}
.msg .text{white-space:pre-wrap;max-width:70ch}
.quiz{padding:18px;display:flex;flex-direction:column;gap:18px}
.q{display:flex;flex-direction:column;gap:8px}
.q legend{font-weight:700;padding:0;margin-bottom:4px}
.q fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2);cursor:pointer}
.opt:hover{border-color:var(--accent-ink)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent-ink);background:var(--pick)}
.locked .opt{cursor:default}
.hsel,.hother{border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;background:var(--surface-2);max-width:100%}
.hother{width:100%}
.q textarea{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface-2);min-height:140px;resize:vertical}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;font-size:14px;white-space:nowrap;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--hot)}
.sidebody{padding:14px;display:flex;flex-direction:column;gap:12px;max-height:70vh;overflow:auto;font-size:14px}
.order{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:3px}
.order.hit{border-color:var(--accent-ink);background:var(--pick)}
.order b{font-family:var(--f-mono);font-size:13px}
.pol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.faq{display:flex;flex-direction:column;gap:10px}
.faq p{margin:2px 0 0;color:var(--muted)}
.sla{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.sla th,.sla td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,20,22,.55);z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:var(--r);max-width:620px;width:100%;max-height:90vh;overflow:auto;border-top:6px solid var(--urgent)}
.modal .mhead{padding:16px 20px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.note{background:var(--high-soft);border:1px dashed var(--high);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--nav);color:var(--nav-fg);padding:12px 16px;border-radius:var(--r);max-width:340px;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* results */
.score-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-size:56px;font-weight:700;font-family:var(--f-mono);line-height:1}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.track{height:8px;background:var(--surface-2);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;background:var(--accent-ink)}
.flag{background:var(--urgent-soft);color:var(--urgent);border-radius:var(--r);padding:8px 12px;font-weight:600}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.rtable td.good{color:var(--ok);font-weight:600} .rtable td.bad{color:var(--urgent);font-weight:600}
.scroll{overflow-x:auto}

@media (max-width:1080px){.desk{grid-template-columns:220px minmax(0,1fr)}.side{grid-column:1/-1;position:static}}
@media (max-width:760px){.brief{grid-template-columns:minmax(0,1fr)}.brand small{display:none}.intro,.desk{grid-template-columns:minmax(0,1fr)}.bars{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:32px minmax(0,1fr)}.tctrl{grid-column:2}.queue{max-height:260px;overflow:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 // ===== SAFETY =====
 {id:4101,slot:"safety",w:100,pri:"Urgent",subj:"Magnet came off badge, my son nearly swallowed it",from:"Sam Kelly",org:"Wattle Grove Childcare",ch:"Email",brand:"Name Badges Australia",order:"SO-23274",
  body:"One of the magnetic backs on the badges we bought came apart this afternoon and the small magnet fell on the floor. One of the toddlers picked it up and had it in his mouth before an educator grabbed it. He's fine but I'm really shaken. We've got 25 of these being worn around small children every day. Is this normal?? What should we do?",
  q:[{cat:"j",p:"What do you do with this ticket?",o:[
   {t:"Reassure Sam the magnets meet Australian safety standards, apologise for the scare, and ask how the back came apart so we can check it.",pts:0,flag:"Told a customer a product involved in a safety incident was safe"},
   {t:"Escalate to Jamie Hassard now. Tell Sam you're glad he's OK, ask her to stop using all 25 badges and keep them, and say someone will call today.",pts:2},
   {t:"Apologise, offer a full refund plus replacement badges with pin backs so nothing similar can happen, and close the ticket once she accepts.",pts:0,flag:"Promised a refund/replacement without approval"},
   {t:"Tag it badgeproduction and assign it to the production team, since they'll know whether this batch of magnetic backs has a fault.",pts:0}]}],
  h:[["Escalate to Jamie Hassard (product safety)",2],["Call Sam to discuss",1],["Reply by email",0],["Refund the order",0]],
  follow:{id:4201,subj:"Still no reply about the magnet",from:"Sam Kelly",org:"Wattle Grove Childcare",ch:"Email",brand:"Name Badges Australia",order:"SO-23274",
   body:"Still haven't heard anything from you. We took Oliver to the GP to be safe. A couple of the parents have now posted about it in our community Facebook group and someone tagged Name Badges Australia. I need to know today what you're doing about this.",
   q:{cat:"c",p:"What do you do with this ticket?",o:[
    {t:"Reply that the badges meet safety standards and the Facebook posts are inaccurate, and ask Sam to share our reply.",pts:0,flag:"Told a customer a product involved in a safety incident was safe"},
    {t:"Link it to {#parent}, update Jamie with the GP visit and posts, loop in Mel Liu and Rich, and contact Sam today.",pts:2},
    {t:"Apologise, and ask Sam to take the Facebook posts down while we look into it, to avoid unnecessary worry.",pts:0},
    {t:"Log it as a new ticket at Normal priority, and reply that we're looking into her original email.",pts:0}]},
   h:[["Escalate to Jamie Hassard, Mel Liu and Rich",2],["Call Sam to discuss",1],["Reply by email",0],["Refund the order",0]]}},
 {id:4102,slot:"safety",w:100,pri:"Urgent",subj:"Lanyard clip didn't release, staff member nearly hurt",from:"Rob Castellano",org:"Pacific Freight Logistics",ch:"Email",brand:"Name Badges Australia",order:"SO-23279",
  body:"One of our forklift operators had his lanyard caught on a machine guard this morning and the breakaway clip didn't release like it's meant to. He got it off in time but it could have been really serious. We bought 200 of these from you last month specifically because they were safety breakaway lanyards. What's going on?",
  q:[{cat:"j",p:"What do you do with this ticket?",o:[
   {t:"Explain breakaway clips can be stiff when new and loosen with use, apologise for the scare, and send a guide on fitting them correctly.",pts:0,flag:"Gave technical advice on a safety incident"},
   {t:"Escalate to Jamie Hassard now. Ask Rob to stop using all 200 lanyards and keep them, including the one involved, and say someone will call today.",pts:2},
   {t:"Apologise, send 200 replacement lanyards by express so his team isn't without them, and ask him to dispose of the faulty batch.",pts:0,flag:"Promised a replacement without approval"},
   {t:"Forward it to the production team to check the batch for faulty clips, and let Rob know you'll come back to him once they've looked.",pts:1}]}],
  h:[["Escalate to Jamie Hassard (product safety)",2],["Call Rob to discuss",1],["Reply by email",0],["Send replacements",0]],
  follow:{id:4202,subj:"Re: Lanyard clip — WorkSafe involved",from:"Rob Castellano",org:"Pacific Freight Logistics",ch:"Email",brand:"Name Badges Australia",order:"SO-23279",
   body:"Our safety officer has now logged this as a near miss with WorkSafe and they've asked for the supplier's details. I need a response from someone senior today.",
   q:{cat:"c",p:"What do you do with this ticket?",o:[
    {t:"Tell Rob the lanyards passed testing, so there's nothing to report, and offer to send him the test certificate.",pts:0,flag:"Told a customer a product involved in a safety incident was safe"},
    {t:"Link it to {#parent}, update Jamie, loop in Mel Liu and Rich as a regulator is involved, and tell Rob someone senior will call.",pts:2},
    {t:"Send WorkSafe our company details and the order information yourself, so the near miss is dealt with quickly.",pts:0,flag:"Contacted a regulator without escalating"},

 {id:4103,slot:"safety",w:100,pri:"Urgent",subj:"Badge pin snapped and cut a volunteer",from:"Leanne Firth",org:"Harbourside Fun Run",ch:"Email",brand:"Name Badges Australia",order:"SO-23283",

  h:[["Escalate to Jamie Hassard (product safety)",2],["Call Leanne to discuss",1],["Reply by email",0],["Send replacements",0]],

 {id:4111,slot:"security",w:95,pri:"Urgent",subj:"Updated bank details for invoices",from:"accounts@signal-groups-supplies.com",org:"",ch:"Email",brand:"The Signal Group",
  body:"Dear Accounts Team, please note our banking details have changed effective immediately. All outstanding and future invoice payments should be made to the new account below. Please confirm once updated in your system.\n\nBSB 062-000  Acc 1234 5678\n\nKind regards, Signal Supplies Accounts",
  q:[{cat:"j",p:"What do you do with this ticket?",o:[
    {t:"Update the supplier's bank details in the system so future invoices aren't delayed, then reply to confirm the change is done.",pts:0,flag:"Actioned a bank-details change from an email"},
    {t:"Reply asking them to confirm the change by phone, on the number in their email signature, before you update anything.",pts:1},
    {t:"Don't reply or update anything. Forward it to Finance and flag it to Rich as suspected fraud so they can verify it properly.",pts:2},
    {t:"Delete it, as it isn't a customer ticket and supplier payments aren't handled by the customer service team.",pts:0}]},
   {cat:"a",trap:"Spotted the lookalike sender domain",p:"What is the strongest sign something is wrong?",o:[
    {t:"It arrived at 7:52am, before the office opens, which is unusual timing for a genuine supplier's accounts team.",pts:0},
    {t:"The sender's domain is signal-groups-supplies.com, which isn't ours or a supplier we deal with.",pts:2,trap:true},
    {t:"It doesn't include an ABN or letterhead, which a genuine supplier would attach to any change in banking details.",pts:0}]}],
  h:[["Escalate to Finance and Rich (suspected fraud)",2],["Call the sender to verify",0],["Reply by email",0],["Update the bank details",0]]},
 {id:4112,slot:"security",w:95,pri:"Urgent",subj:"Urgent favour",from:"rich.till@thesignalgroup-au.com",org:"",ch:"Email",brand:"The Signal Group",
  body:"Hi, I'm stuck in meetings all day and need a quick favour. Can you buy 10 x $200 Apple gift cards for a client thank-you and send me the codes by 11am? I'll sort the reimbursement tomorrow. Please keep this between us for now.\n\nRich",
  q:[{cat:"j",p:"What do you do with this ticket?",o:[
    {t:"Buy the gift cards on the company card, since it's from Rich and urgent, then send him the codes before 11am.",pts:0,flag:"Acted on a gift-card scam email"},
    {t:"Reply to the email asking Rich which client it's for, and whether the codes should go to him or straight to the client.",pts:0},
    {t:"Don't reply. Check with Rich directly on Teams or by phone, and report the email as suspected phishing.",pts:2},
    {t:"Ignore it and delete it. If it's genuine, Rich will follow up with you on Teams later in the day.",pts:1}]},
   {cat:"a",trap:"Spotted the lookalike sender domain",p:"What gives it away?",o:[
    {t:"The address is thesignalgroup-au.com, not thesignalgroup.com.au, and it asks for secrecy and gift cards.",pts:2,trap:true},
    {t:"Rich doesn't usually email before 9am, and the message is shorter and less friendly than his normal emails.",pts:0},
    {t:"Nothing obvious: it uses Rich's name and signs off normally, so it's reasonable to treat it as genuine.",pts:0}]}],
  h:[["Verify with Rich on Teams and report as phishing",2],["Reply by email",0],["Buy the gift cards",0]]},
 {id:4113,slot:"security",w:95,pri:"Urgent",subj:"Action required: your shipment is on hold",from:"auspost-delivery@parcel-notify.net",org:"",ch:"Email",brand:"The Signal Group",
  body:"Your shipment AP-7781-23 is held at customs. A fee of $3.95 must be paid within 24 hours or the parcel will be returned. Pay now: auspost-clearance.net/pay\n\nAustralia Post",
  q:[{cat:"j",p:"What do you do with this ticket?",o:[
    {t:"Pay the $3.95 fee so the shipment isn't returned, then check with Finance afterwards which order it was for.",pts:0,flag:"Paid a phishing link"},
    {t:"Forward it to the customer whose parcel it might be, so they can pay the customs fee and avoid a delay.",pts:0},
    {t:"Don't click the link. Report it to Rich as phishing and close the ticket without replying to the sender.",pts:2},
    {t:"Reply asking which order number it relates to, so you can match it to a customer before deciding what to do.",pts:0}]},
   {cat:"a",trap:"Spotted the lookalike sender domain",p:"What is the strongest sign it's fake?",o:[
    {t:"The sender's address and the payment link aren't on Australia Post's own auspost.com.au domain.",pts:2,trap:true},
    {t:"The fee is very small, which is typical of a test charge before a larger fraudulent payment is taken.",pts:0},
    {t:"There's no order number or customer name, so it can't be matched to any of our shipments.",pts:0}]}],
  h:[["Report to Rich as phishing",2],["Forward to the customer",0],["Pay the fee",0]]},

 {id:4122,slot:"media",w:85,pri:"Urgent",subj:"Letter of demand: unauthorised use of trade mark",from:"Hartley & Co Lawyers",org:"for Northern Rays Football Club",ch:"Email",brand:"Just Coolers",

// Draw one ticket per theme and lay out the queue in a random arrival order (follow-ups always after the original).
function drawSession(){
  const bySlot={};POOL.forEach(t=>(bySlot[t.slot]??=[]).push(t));
  const picks=SLOTS.filter(s=>s!=="dup").map(s=>bySlot[s][Math.floor(Math.random()*bySlot[s].length)]);
  const dl=picks.find(t=>t.slot==="deadline");
  let ids=shuffle(picks.map(t=>t.id));
  const dupId=dl.dup.id;const pi=ids.indexOf(dl.id);
  const slotAfter=pi+1+Math.floor(Math.random()*(ids.length-pi)); ids.splice(Math.min(slotAfter,ids.length),0,dupId);
  const num={},rec={};ids.forEach((id,i)=>{num[id]=4101+i;rec[id]=TIMES[i];});
  const safety=picks.find(t=>t.slot==="safety");
  const pool=shuffle(EXTRA.filter(x=>!x.requires||ids.includes(x.requires)).map(x=>x.t.id));
  const used=new Set(ids.map(id=>ALL[id].order).filter(Boolean));
  const decoys=shuffle(ORDERS.filter(o=>!used.has(o.so)).map(o=>o.so)).slice(0,3);
  return {set:ids,num,rec,deadline:dl.id,safety:safety.id,follow:safety.follow.id,pool,decoys};
}

    ?`<li>Add the candidate's email to Cloudflare Access, then send them this page's link. For 35 minutes, add <span class="mono">#t35</span> to the end.</li>`
    :`<li>Share this page from its Share menu with a link anyone can open, then send the candidate the link. For 35 minutes, add <span class="mono">#t35</span> to the end of the link.</li>`;
  return `<div class="intro">
   ${canStore()?`<section class="panel wide">${historyBlock("Completed responses")}</section>`:""}
   <section class="panel">
    <span class="eyebrow">Assessor setup</span>
    <h2>Set up the next candidate</h2>
    <p class="muted" style="max-width:62ch">For an in-person session, enter the candidate's name and time limit, then hand over. The page locks again as soon as you do.</p>
    <div class="field"><label for="cand">Candidate's full name (optional, they can type it themselves)</label><input id="cand" autocomplete="off" value="${esc(S.name)}" placeholder="e.g. Alex Morgan"></div>
    <div class="field"><label for="mins">Time limit</label>
     <select id="mins"><option value="25"${S.mins==25?" selected":""}>25 minutes (recommended)</option><option value="35"${S.mins==35?" selected":""}>35 minutes</option></select></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="handover">Lock and show the candidate briefing</button></div>
   </section>
   <section class="panel">
    <h2>Remote interview</h2>
    <ol class="steps">
     ${remote}
     <li>On the video call, ask them to share their screen for the whole exercise.</li>
     <li>They read the briefing, enter their name and start the timer themselves.</li>
     <li>When they finish, their responses save automatically and appear under Completed responses. If saving fails, they'll see a results code to paste into the call chat, and you paste it below.</li>
    </ol>
    <div class="field"><label for="pasteCode" class="label">Open a candidate's results code</label>
     <textarea id="pasteCode" rows="3" class="codebox" placeholder="TSG1-…">${esc(S.pasted||"")}</textarea>
     ${S.codeErr?`<p class="err" role="alert">${esc(S.codeErr)}</p>`:""}
     <button class="btn primary" id="loadCode" style="align-self:flex-start">Show results</button></div>
   </section></div>`;
}

function briefView(){
  return `<div style="display:flex;flex-direction:column;gap:16px">
   <section class="panel">
    <span class="eyebrow">Your briefing · read before you start</span>
    <h1>Welcome${S.name.trim()?", "+esc(S.name.trim().split(" ")[0]):""}. Today you're a Customer Service Officer at <em>The Signal Group</em>.</h1>
    <p class="muted" style="max-width:70ch">The Signal Group runs Just Coolers (custom printed stubby coolers) and Name Badges Australia (printed, engraved and magnetic name badges). We're based in Helensvale on the Gold Coast, and our support team works in Zendesk. It's Tuesday, 9:00am, and a colleague has called in sick. Their queue of open tickets is now yours.</p>
   </section>
   <div class="brief">
    <section class="panel"><h3><span class="num">01</span>What you need to do</h3>
     <ul><li><b>Step 1, triage.</b> Read every ticket in the queue. Put them in the order you'd handle them (1 = first) and give each a Zendesk priority: Urgent, High, Normal or Low.</li>
      <li><b>Step 2, work your tickets.</b> Open each ticket and choose what you'd do. One ticket also asks you to write a reply in your own words.</li>
      <li><b>Handle interruptions.</b> New tickets and messages will land in your queue about every five minutes. Decide where each one fits, then carry on.</li></ul></section>
    <section class="panel"><h3><span class="num">02</span>The parameters</h3>
     <ul><li>You have <b>${S.mins} minutes</b>. The timer starts when you press Start and can't be paused.</li>
      <li>Once you lock your triage you can't go back and change it.</li>
      <li>Answers on a ticket lock when you press Submit and solve.</li>
      <li>You can work tickets in any order, but we'll see the order you chose.</li>
      <li>Tickets you don't reach aren't scored, so keep moving. When time runs out, the exercise ends.</li>
      <li>Use the <b>Order lookup</b>, <b>Policies</b> and <b>FAQ</b> tabs beside every ticket. Customers sometimes get details wrong.</li></ul></section>
    <section class="panel"><h3><span class="num">03</span>Rules of engagement</h3>
     <ul><li><b>Rich Till is your escalation point.</b> He approves refunds, credits and free reprints (with Finance), and handles privacy requests, difficult customers and outages.</li>
      <li><b>Product safety:</b> escalate to Jamie Hassard straight away. Don't give medical or technical advice. Tell the customer to stop using the product and keep it.</li>
      <li><b>Media or legal enquiries:</b> forward to Mel Liu. Agents never comment.</li>
      <li><b>Bank or payment detail changes:</b> never action them from an email. Forward to Finance and flag to Rich.</li>
      <li><b>Approved proofs are final.</b> Any goodwill gesture needs Rich's approval, so never promise one.</li>
      <li><b>Duplicates:</b> merge into the oldest ticket.</li>
      <li><b>Passwords and card details:</b> never ask for or send a password, and never take card details by email.</li>
      <li><b>Help Center FAQ:</b> the FAQ tab beside every ticket has our dispatch times, shipping, returns, cancellations and login help. Use it.</li>
      <li><b>Help Center:</b> link an article when it answers the question, for example How to Order Online or Artwork approval process.</li>
      <li><b>Tone:</b> professional but casual. Use the customer's first name.</li></ul></section>
    <section class="panel"><h3><span class="num">04</span>Service levels (SLAs)</h3>
     <p class="muted">How quickly each priority must get a first reply and be resolved. Sales quotes run on a tighter first-reply target.</p>
     <div class="scroll"><table class="sla"><tr><th></th><th>Urgent</th><th>High</th><th>Normal</th><th>Low</th></tr>
      <tr><td>First reply</td><td>1h</td><td>6h</td><td>24h</td><td>48h</td></tr>
      <tr><td>Sales quote first reply</td><td>30m</td><td>2h</td><td>4h</td><td>8h</td></tr>
      <tr><td>Total resolution</td><td>4h</td><td>12h</td><td>72h</td><td>100h</td></tr></table></div></section>
    <section class="panel wide"><h3><span class="num">05</span>How you'll be assessed</h3>
     <ul><li><b>Prioritisation:</b> what you handle first, and the priority you give each ticket.</li>
      <li><b>Accuracy:</b> whether you check the details against the order lookup and the policies.</li>
      <li><b>Judgement:</b> knowing what you can decide yourself and what you must escalate.</li>
      <li><b>Adapting to change:</b> how you respond when something new comes in.</li>
      <li><b>Writing:</b> your reply to an unhappy customer.</li></ul>
     <p class="muted">Nobody gets everything right. Work the way you would on a real shift.</p></section>
   </div>
   <section class="startbar">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0;flex:1 1 320px">
     <div class="field"><label for="bname" style="color:#fff;font-weight:600">Your full name</label><input id="bname" autocomplete="name" value="${esc(S.name)}" placeholder="e.g. Alex Morgan" style="max-width:360px"></div>
     <label class="ack" for="ack"><input type="checkbox" id="ack" ${S.ack?"checked":""}>I've read the briefing and I'm ready to start the timer.</label></div>
    <button class="btn primary" id="go" ${S.ack&&S.name.trim()?"":"disabled"}>Start the ${S.mins}-minute timer</button>
   </section>
   <button class="linkish" id="toSetup" style="align-self:flex-start">Assessor area</button>
  </div>`;
}

function triageView(){
  const rows=S.order.map((id,i)=>{const t=byId(id),p=S.pri[id]||"";return `<div class="trow">
    <div class="rank">${i+1}</div>
    <div class="tmain">
     <div class="tmeta"><span class="mono">${dn(id)}</span><span>${esc(t.from)}${t.org?" · "+esc(t.org):""}</span><span class="chip">${esc(t.ch)}</span><span>${esc(S.rec[id]||"")}</span></div>
     <div class="tsubj">${esc(t.subj)}</div>
     <div class="tbody">${esc(t.body)}</div>
    </div>
    <div class="tctrl">
     <select data-pri="${t.id}" class="${p?"":"unset"}" aria-label="Priority for ticket ${dn(id)}"><option value="">Priority…</option>${PRI.map(x=>`<option${x===p?" selected":""}>${x}</option>`).join("")}</select>
     <div class="moves"><button data-up="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button><button data-down="${i}" ${i===S.order.length-1?"disabled":""} aria-label="Move down">↓</button></div>
    </div></div>`}).join("");
  const left=S.order.filter(id=>!S.pri[id]).length;
  return `<div class="desk" style="grid-template-columns:minmax(0,1fr) 340px">
   <div style="min-width:0">
    <div class="triage-head"><div><h2>Your queue: ${S.order.length} open tickets</h2><p class="muted">Read each ticket, use the arrows to put the one you'd handle first at the top, then set every priority.</p></div>
     <button class="btn primary" id="toWork" ${left?"disabled":""}>${left?`Set ${left} more ${left===1?"priority":"priorities"}`:"Lock triage and start working"}</button></div>
    <div class="tlist">${rows}</div>
   </div>
   ${sideView()}</div>`;
}

function sideView(){
  const cur=S.current?byId(S.current):null;
  const refs=new Set([...S.set,...S.arrived].map(id=>ALL[id]?.order).filter(Boolean).concat(S.decoys||[]));
  const orders=ORDERS.filter(o=>refs.has(o.so)).map(o=>`<div class="order ${cur&&cur.order===o.so?"hit":""}"><b>${o.so}</b><span>${esc(o.cust)}</span><span class="muted">${esc(o.brand)} · ${esc(o.items)}</span><span>${esc(o.status)}</span></div>`).join("");
  const pol=`<ul class="pol">
   <li><b>Escalation point: Rich Till.</b> Refunds, credits, replacements and free reprints need approval from Rich or Finance before you promise them. Rich also handles privacy requests, difficult customers and outages.</li>
   <li><b>Product safety:</b> escalate to Jamie Hassard straight away. No medical or technical advice; tell the customer to stop using the product and keep it.</li>
   <li><b>Media or legal:</b> forward to Mel Liu. Agents don't comment.</li>
   <li><b>Bank or payment detail changes:</b> never action from an email. Forward to Finance and flag to Rich.</li>
   <li><b>Approved proofs are final.</b> Goodwill gestures need Rich's approval.</li>
   <li><b>Duplicates:</b> merge into the oldest ticket.</li>
   <li><b>Untracked shipping (name badges):</b> if a customer chose untracked shipping and the badges go missing, we don't remake them free of charge. The customer accepted that risk. Recommend tracked shipping, especially for shopping-centre stores.</li>
   <li><b>Returns (faulty items only):</b> no change-of-mind refunds. Faulty items must be reported within 14 days of dispatch. Once approved, Customer Service issues an RMA number; the item comes back securely packed within 14 days, at the customer's postage cost.</li>
   <li><b>Bulk orders and freight quotes:</b> customers can use the bulk feature in the product customiser, or Sales sends a bespoke quote.</li>
   <li><b>Fully custom, large-volume or ongoing orders:</b> route to The Signal Group sales team (tag Sales Account Manager). They offer volume pricing, sourcing and dedicated reordering portals. Quotes: salessupport@thesignalgroup.com.au or 07 5519 3637.</li>
   <li><b>Careers, donations and sponsorships:</b> forward to Rich. Don't make promises.</li>
   <li><b>Help Center articles:</b> How to Order Online, Artwork approval process (file types and artwork specs), Our Returns Policy, Trading Terms & Conditions.</li>
   <li><b>Passwords and card details:</b> never ask for or send a password, and never take card details by email. Customer accounts log in with an emailed code, not a password.</li>
   <li><b>Tags:</b> JustCoolers, badgeproduction, badgeDispatch, EngravedProduction, Sales Account Manager.</li>
  </ul>
  <div class="scroll"><table class="sla"><caption class="label" style="text-align:left;padding-bottom:4px">SLAs</caption><tr><th></th><th>Urgent</th><th>High</th><th>Normal</th><th>Low</th></tr>
   <tr><td>First reply</td><td>1h</td><td>6h</td><td>24h</td><td>48h</td></tr>
   <tr><td>Sales quote reply</td><td>30m</td><td>2h</td><td>4h</td><td>8h</td></tr>
   <tr><td>Resolution</td><td>4h</td><td>12h</td><td>72h</td><td>100h</td></tr></table></div>`;
  return `<aside class="side"><div class="tabs" role="tablist">
   <button role="tab" data-tab="orders" aria-selected="${S.sideTab==="orders"}">Order lookup</button>
   <button role="tab" data-tab="policy" aria-selected="${S.sideTab==="policy"}">Policies</button>
   <button role="tab" data-tab="faq" aria-selected="${S.sideTab==="faq"}">FAQ</button></div>
   <div class="sidebody">${S.sideTab==="orders"?orders:S.sideTab==="faq"?FAQ_HTML:pol}</div></aside>`;
}

function workView(){
  const q=S.queue.map(id=>{const t=byId(id),done=S.done.includes(id);return `<button class="qitem ${S.current===id?"active":""}" data-open="${id}">
   <span class="m"><span class="mono">${dn(id)}</span>${t.curve&&!done?`<span class="chip new">New</span>`:""}${done?`<span class="chip done">Solved</span>`:(S.pri[id]?`<span class="pri ${S.pri[id]}">${S.pri[id]}</span>`:"")}</span>
   <span class="s">${esc(t.subj)}</span><span class="m">${esc(t.from)}</span></button>`}).join("");
  const remaining=S.queue.filter(id=>!S.done.includes(id)).length;
  return `<div class="desk">
   <nav class="queue" aria-label="Ticket queue"><h3><span>My open tickets</span><span class="muted">${remaining} left</span></h3>${q}</nav>
   ${S.current?ticketView(S.current):`<section class="ticket"><div class="empty">Pick a ticket from your queue to start.</div></section>`}
   ${sideView()}</div>`;
}

function ticketView(id){
  const t=byId(id),qs=t.q,done=S.done.includes(id),ans=S.answers[id]||{};
  const hOk=ans.h!=null&&ans.h!==""&&(ans.h!=="o"||(ans.ho||"").trim());
  const ready=hOk&&qs.every((q,i)=>q.cat==="w"||q.cat==="p"?true:ans[i]!=null);
  const hopts=t.h||[];
  const hhtml=`<div class="q"><label class="label" for="h${id}">How would you handle this ticket?</label>
    <select id="h${id}" data-h="${id}" class="hsel" ${done?"disabled":""}><option value="">Choose how you'd handle it…</option>${perm(id+"_h",hopts.length).map(j=>{const o=hopts[j];return `<option value="${j}" ${String(ans.h)===String(j)?"selected":""}>${esc(fmt(o[0],id))}</option>`}).join("")}<option value="o" ${ans.h==="o"?"selected":""}>${OTHER}</option></select>
    ${ans.h==="o"?`<input id="ho${id}" data-ho="${id}" class="hother" ${done?"readonly":""} value="${esc(ans.ho||"")}" placeholder="Describe how you'd handle it" aria-label="Describe how you'd handle ticket ${dn(id)}">`:""}</div>`;
  const first=(t.from||"").split(" ")[0];
  const qhtml=hhtml+qs.map((q,i)=>q.cat==="p"?proofHtml(id,q,i,ans,done):q.cat==="w"
    ?`<div class="q"><label class="label" for="w${id}">${esc(fmt(q.p,id))}</label><textarea id="w${id}" data-w="${id}" ${done?"readonly":""} ${q.draft?'rows="9"':""} placeholder="Hi ${esc(first)},">${esc(ans.w!=null?ans.w:(q.draft?t.draft:""))}</textarea></div>`
    :`<div class="q"><fieldset ${done?"disabled":""}><legend>${esc(fmt(q.p,id))}</legend>${perm(id+"_"+i,q.o.length).map(j=>{const o=q.o[j];return `<label class="opt ${ans[i]===j?"sel":""}"><input type="radio" name="q${id}_${i}" data-q="${id}" data-i="${i}" value="${j}" ${ans[i]===j?"checked":""}><span>${esc(fmt(o.t,id))}</span></label>`}).join("")}</fieldset></div>`).join("");
  const initials=t.from.split(/[\s@.]/).filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join("");
  return `<section class="ticket ${done?"locked":""}">
   <div class="thead"><div class="tmeta"><span class="mono">${dn(id)}</span><span class="chip">${esc(t.brand)}</span><span class="chip">${esc(t.ch)}</span>${S.pri[id]?`<span class="pri ${S.pri[id]}">${S.pri[id]}</span>`:""}${done?`<span class="chip done">Solved</span>`:""}</div><h2>${esc(t.subj)}</h2></div>
   <div class="convo"><div class="avatar">${esc(initials)}</div><div class="msg"><span class="who"><b>${esc(t.from)}</b>${t.org?" · "+esc(t.org):""} <span class="muted">· ${esc(S.rec[id]||"")}</span></span><div class="text">${esc(t.body)}</div></div></div>
   ${t.draft?`<div class="copilot"><div class="copilot-head"><span class="copilot-badge">Copilot</span><b>Suggested reply</b><span class="muted">Generated by Zendesk Copilot. Check it before sending.</span></div><div class="text">${esc(t.draft)}</div></div>`:""}
   <div class="quiz">${qhtml}
    <div class="qfoot"><span class="muted">${done?"Submitted. You can't change this ticket now.":"Answers lock when you submit."}</span>
    ${done?"":`<button class="btn primary" id="submitT" ${ready?"":"disabled"}>Submit and solve</button>`}</div></div></section>`;
}

function doneView(){
  return `<section class="panel" style="max-width:640px;margin:40px auto">
   <span class="label">Shift complete</span><h1>Thanks, ${esc(S.name.split(" ")[0]||"")}. That's the end of the exercise.</h1>
   <p class="muted">Please let your interviewer know you've finished. They'll talk through your choices with you next.</p>
   ${S.saved===true?`<p class="chip done" style="align-self:flex-start">Your answers have been sent to your interviewer.</p>`:S.saved===null?`<p class="muted">Sending your answers…</p>`:`
   <div class="field"><label class="label" for="rcode">Your results code</label>
    <p>Copy this code and paste it into the chat with your interviewer (Teams, Zoom or email). Don't close this page until they confirm they have it.</p>
    <textarea id="rcode" readonly rows="4" class="codebox">${esc(S.code)}</textarea>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="copyCode">Copy code</button><span id="copyMsg" class="muted" role="status"></span></div></div>`}
   <button class="linkish" id="showRes" style="align-self:flex-start">Assessor: unlock results</button></section>`;
}

function resultsView(r){
  if(!r) return `<div class="empty">No results.</div>`;
  if(!r.set) return `<section class="panel"><h2>${esc(r.name||"Result")}</h2><p class="muted">This result was saved by an older version of the exercise and can't be shown in detail. Score: ${Math.round(r.total||0)} / 100.</p><button class="btn" id="backStart">Back to assessor area</button></section>`;
  const N=r.num||{},D=id=>dn(id,N),F=(txt,id)=>fmt(txt,id,N);
  const B=benchStats();
  const bar=(name,v,max,bv)=>`<div class="bar"><span class="label">${name}</span><span><b class="mono" style="font-size:22px">${Math.round(v)}</b><span class="muted"> / ${max}</span></span><div class="track" style="position:relative"><div class="fill" style="width:${Math.max(0,Math.min(100,v/max*100))}%"></div>${bv!=null?`<div class="bench-mark" style="left:${Math.max(0,Math.min(100,bv/max*100))}%" title="Team benchmark ${Math.round(bv)}"></div>`:""}</div>${bv!=null?`<span class="muted" style="font-size:12px">Team benchmark: ${Math.round(bv)}</span>`:""}</div>`;
  const model=modelOrder(r.set);
  const ord=r.order.map((id,i)=>{const t=ALL[id],m=model.indexOf(id)+1,diff=Math.abs(m-(i+1));const okPri=r.pri[id]===t.pri||(t.alt||[]).includes(r.pri[id]);
    return `<tr><td class="mono">${i+1}</td><td class="mono">${D(id)}</td><td>${esc(t.subj)}</td><td class="mono ${diff<=1?"good":diff>=4?"bad":""}">${m}</td><td class="${okPri?"good":""}">${r.pri[id]||"—"}${okPri?"":` <span class="muted">(ideal: ${t.pri})</span>`}</td></tr>`}).join("");
  const arr=r.arrived||[];
  const best=list=>list.reduce((b,x)=>(x.pts??x[1])>(b.pts??b[1])?x:b);
  const cbDef=ALL[r.deadline].cb1;const cb1=r.cb1!=null?cbDef.o[r.cb1]:null;
  return `<div style="display:flex;flex-direction:column;gap:20px">
   <div class="score-hero"><div><span class="label">${esc(r.name)} · ${new Date(r.finishedAt).toLocaleString("en-AU",{dateStyle:"medium",timeStyle:"short"})}</span><div class="big">${Math.round(r.total)}<span class="muted" style="font-size:24px"> / 100</span></div>${B?`<div class="muted">Team benchmark: <b class="mono">${Math.round(B.total)}</b> average across ${B.n} agent${B.n>1?"s":""}</div>`:""}</div>
    <div class="muted" style="max-width:52ch">Auto-scored from their choices. Score the written reply yourself using the rubric's "Written responses" criterion. ${r.complete?"Finished all tickets":"Ran out of time or finished early"} in ${Math.floor(r.secs/60)}m ${String(Math.round(r.secs%60)).padStart(2,"0")}s. Each candidate gets a different mix of tickets, one from every theme.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="backStart">Back to assessor area</button>${r._fromCode&&canStore()&&!r._saved?`<button class="btn primary" id="saveCode">Save to results list</button>`:""}${r._saved&&r._fromCode?`<span class="chip done">Saved</span>`:""}${canStore()?`<button class="btn" id="hist">All saved results</button>`:""}</div></div>
   <div class="bars">${bar("Prioritisation",r.parts.prio,30,B&&B.prio)}${bar("Accuracy",r.parts.acc,25,B&&B.acc)}${bar("Judgement",r.parts.judg,25,B&&B.judg)}${bar("Adaptability",r.parts.adapt,20,B&&B.adapt)}</div>
   ${signalsHtml(r)}
   ${r.flags.length?`<section style="display:flex;flex-direction:column;gap:8px"><h3>Red flags (${r.flags.length})</h3>${r.flags.map(f=>`<div class="flag">${esc(f)}</div>`).join("")}</section>`:`<p class="chip done" style="align-self:flex-start">No red flags</p>`}
   <section class="panel"><h3>Accuracy checks caught: ${r.traps.length} of ${r.trapsAll.length}</h3><ul class="pol">${r.trapsAll.map(x=>`<li>${r.traps.includes(x)?"✓":"✗"} ${esc(x)}</li>`).join("")}</ul></section>
   <section class="panel"><h3>Triage order vs ideal</h3><div class="scroll"><table class="rtable"><tr><th>Their rank</th><th>Ticket</th><th>Subject</th><th>Ideal rank</th><th>Priority set</th></tr>${ord}</table></div>
    <p class="muted">Order they actually worked tickets: ${r.seq.map(x=>D(x)).join(" → ")||"none"}</p></section>
   <section class="panel"><h3>Curveballs</h3>
    <p><b>Phone message (${esc(cbDef.title)}):</b> ${cb1?esc(F(cb1.t,r.deadline))+` <span class="muted">(${cb1.pts}/2)</span>`:`<span class="muted">Not answered</span>`}</p>
    ${arr.length?arr.map(id=>{const a=r.answers[id];const o=a&&a[0]!=null?ALL[id].q[0].o[a[0]]:null;return `<p><b>${D(id)} ${esc(ALL[id].subj)}:</b> ${o?esc(F(o.t,id))+` <span class="muted">(${o.pts}/2)</span>`:`<span class="muted">Arrived but not worked</span>`}</p>`}).join(""):`<p class="muted">No new tickets arrived before the end.</p>`}
    <p class="muted">Adaptability only counts curveballs that arrived.</p></section>
   ${(r.review||[]).length?`<section class="panel"><h3>"Other" handling answers to review (${r.review.length})</h3><p class="muted">These weren't auto-scored. Read them and adjust the Judgement score if they're sound.</p><div class="scroll"><table class="rtable">${r.review.map(x=>`<tr><td class="mono">${D(x.id)}</td><td>${esc(x.text||"(left blank)")}</td><td class="muted">Best: ${esc(F(best(ALL[x.id].h)[0],x.id))}</td></tr>`).join("")}</table></div></section>`:""}

// Every response for one candidate, grouped by ticket.
function respHtml(r){
  const N=r.num||{},D=id=>dn(id,N),F=(txt,id)=>fmt(txt,id,N);
  const all=[...r.set,...(r.arrived||[])];
  const order=[...r.seq.filter(id=>all.includes(id)),...all.filter(id=>!r.seq.includes(id))];
  const top=list=>list.reduce((b,x)=>(x.pts??x[1])>(b.pts??b[1])?x:b);
  const line=(label,choice,pts,best)=>`<div class="resp-line"><span class="label">${label}</span><div><div class="${pts===2?"good":pts===0?"bad":""}">${choice}${pts!=null?` <span class="mono muted">(${pts}/2)</span>`:""}</div>${best?`<div class="muted resp-best">Best: ${best}</div>`:""}</div></div>`;
  return `<div class="resp">${order.map(id=>{const t=ALL[id],a=r.answers[id];const done=!!a;
    const secs=r.signals&&r.signals.ticketSecs[id];const pasted=r.signals&&r.signals.pastes.some(p=>p.id===id&&p.len>=20);
    const head=`<div class="resp-head"><span class="mono">${D(id)}</span>${secs!=null?`<span class="chip mono" title="Time on this ticket">${mmss(secs)}</span>`:""}${pasted?`<span class="chip new">Pasted text</span>`:""}<b>${esc(t.subj)}</b><span class="muted">${esc(t.from)}${t.curve?" · arrived during the exercise":""}</span>${r.pri[id]?`<span class="pri ${r.pri[id]}">${r.pri[id]}</span>`:""}${done?"":`<span class="chip">Not reached</span>`}</div>`;
    if(!done)return `<div class="resp-item">${head}</div>`;
    const h=a.h==="o"?line("Handling",`Other: ${esc(a.ho||"(left blank)")}`,null,esc(F(top(t.h)[0],id))):(()=>{const o=t.h[a.h];return line("Handling",o?esc(F(o[0],id)):"—",o?o[1]:null,o&&o[1]===2?"":esc(F(top(t.h)[0],id)));})();
    const qs=t.q.map((q,i)=>{
      if(q.cat==="w"){const txt=a.w!=null?a.w:(t.draft||"");return line(t.draft?"Edited AI draft":"Written reply",`<div class="tbody" style="max-width:none;margin:0">${esc(txt||"(not written)")}</div>${t.draft&&draftUnchanged(t,a)?`<div class="bad">Sent unchanged</div>`:""}`,null,"");}
      if(q.cat==="p"){const pr=proofResult(q,a[i]);const nm=k=>"Badge "+(k+1);
        return line("Proof check",`Selected: ${(Array.isArray(a[i])&&a[i].length)?a[i].map(nm).join(", "):"none"}`,pr.pts,pr.pts===2?"":`Errors were on ${Object.entries(q.errors).map(([k,v])=>`${nm(+k)} (${esc(v)})`).join("; ")}`);}
      const o=a[i]!=null?q.o[a[i]]:null;const b=top(q.o);return line(esc(F(q.p,id)),o?esc(F(o.t,id)):"—",o?o.pts:null,o&&o.pts===2?"":esc(F(b.t,id)));}).join("");
    return `<div class="resp-item">${head}${h}${qs}</div>`;}).join("")}</div>`;
}

// Team benchmark: average of results marked as benchmark (your current agents).
function benchStats(){

  return {n:b.length,total:avg(h=>h.total),prio:avg(h=>h.parts&&h.parts.prio),acc:avg(h=>h.parts&&h.parts.acc),judg:avg(h=>h.parts&&h.parts.judg),adapt:avg(h=>h.parts&&h.parts.adapt),
    min:Math.min(...b.map(h=>h.total)),max:Math.max(...b.map(h=>h.total))};
}

  S.integ.copies.push({at:Math.round(elapsed()),id:S.stage==="work"?S.current:null,len});},true);
function awayStart(){if(!live()||S.integ.awayAt!=null)return;S.integ.awayAt=elapsed();}
function awayEnd(){if(S.integ.awayAt==null)return;const d=elapsed()-S.integ.awayAt;S.integ.awayAt=null;if(d>=1&&S.start)S.integ.away.push({at:Math.round(elapsed()-d),secs:Math.round(d)});}
window.addEventListener("blur",awayStart);window.addEventListener("focus",awayEnd);
document.addEventListener("visibilitychange",()=>document.hidden?awayStart():awayEnd());
function trackView(){
  if(!S.integ)return;const now=elapsed();
  if(S._viewId!=null){S.integ.ticketSecs[S._viewId]=Math.round((S.integ.ticketSecs[S._viewId]||0)+(now-S._viewAt));}
  if(S.stage==="triage"&&S._stageWas!=="triage")S.integ.triageFrom=now;
  if(S._stageWas==="triage"&&S.stage!=="triage")S.integ.triageSecs=Math.round(now-(S.integ.triageFrom||0));
  S._stageWas=S.stage;S._viewId=S.stage==="work"?S.current:null;S._viewAt=now;
}
const newInteg=()=>({pastes:[],copies:[],away:[],ticketSecs:{},triageSecs:null,awayAt:null});
function begin(){
  S.name=S.name.trim();S.stage="triage";S.start=Date.now();S.integ=newInteg();S._viewId=null;S._stageWas=null;
  const d=drawSession();S.perm={};
  Object.assign(S,{set:d.set,order:[...d.set],num:d.num,rec:d.rec,deadline:d.deadline,safety:d.safety,follow:d.follow,pool:d.pool,decoys:d.decoys,nextNum:4101+d.set.length,nextDrop:300});
  tick=setInterval(loop,1000);loop();render();
}
function submitTicket(){
  const id=S.current;S.done.push(id);S.seq.push(id);
  checkCurveballs();
  const next=S.queue.find(x=>!S.done.includes(x));
  if(!next&&S.cb1Shown&&S.cb1!=null&&S.cb2Shown) return finish();
  S.current=next||id;render();window.scrollTo({top:0});
}

function loop(){
  const left=Math.max(0,S.mins*60-elapsed());
  const el=$("#timer");el.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(Math.floor(left%60)).padStart(2,"0")}`;
  el.classList.toggle("warn",left<=120);
  checkCurveballs();
  if(left<=0) finish();
}
function checkCurveballs(){
  const e=elapsed(),total=S.mins*60,solved=S.done.length;
  if(S.start&&e>=S.nextDrop&&S.pool.length&&total-e>90){S.nextDrop+=300;dropTicket(S.pool.shift());}
  if(!S.cb1Shown&&(e>=total*0.4||(S.stage==="work"&&solved>=3))) phoneMessage();
  if(!S.cb2Shown&&S.stage==="work"&&(e>=total*0.68||solved>=7||(S.cb1Shown&&S.cb1!=null&&S.queue.every(x=>S.done.includes(x))))) newTicket();
}
function phoneMessage(){
  S.cb1Shown=true;const CB=ALL[S.deadline].cb1;
  showModal(`<div class="mhead"><span class="label">Message from reception · ${new Date().toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})}</span><h2>${esc(CB.title)}</h2></div>
   <div class="quiz"><div class="note">${esc(CB.note)}</div>
   <div class="q"><fieldset><legend>What do you do now?</legend>${perm("cb1",CB.o.length).map(j=>{const o=CB.o[j];return `<label class="opt"><input type="radio" name="cb1" value="${j}"><span>${esc(fmt(o.t,S.deadline))}</span></label>`}).join("")}</fieldset></div>
   <div class="qfoot"><span class="muted">The clock is still running.</span><button class="btn primary" id="cbGo" disabled>Confirm</button></div></div>`);
  document.querySelectorAll('input[name="cb1"]').forEach(r=>r.onchange=()=>{$("#cbGo").disabled=false;document.querySelectorAll("#layer .opt").forEach(l=>l.classList.toggle("sel",l.querySelector("input").checked));});
  $("#cbGo").onclick=()=>{S.cb1=+document.querySelector('input[name="cb1"]:checked').value;closeModal();if(S.stage==="work"&&S.queue.every(x=>S.done.includes(x))){if(S.cb2Shown)finish();else checkCurveballs();}};
}
function newTicket(){S.cb2Shown=true;dropTicket(S.follow);}
function dropTicket(id){
  const tk=byId(id);S.arrived.push(id);S.num[id]=S.nextNum++;S.rec[id]="Just now";
  if(S.stage==="work"){S.queue.unshift(id);if(!S.current||S.done.includes(S.current))S.current=id;render();}
  else S.pending.push(id);
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML=`<b>New ticket ${dn(id)}</b><br>${esc(tk.from)}: ${esc(tk.subj)}`;
  document.body.appendChild(t);setTimeout(()=>t.remove(),7000);
}
function showModal(html){$("#layer").innerHTML=`<div class="scrim" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`;}
function closeModal(){$("#layer").innerHTML="";}

// ---------- scoring ----------
// Plain-English signs of outside help, for the assessor to discuss. Not proof on their own.
function integritySignals(d){
  const g=d.integ;if(!g)return null;const out=[];const D=id=>id?dn(id,d.num):"";
  const big=g.pastes.filter(p=>p.len>=20);
  big.forEach(p=>out.push(`Pasted ${p.len} characters into ${p.field==="reply"?"the written reply on":"a field on"} ${D(p.id)||"the page"} at ${mmss(p.at)}`));
  if(g.copies.length)out.push(`Copied text from the page ${g.copies.length} time${g.copies.length>1?"s":""} (${g.copies.reduce((a,c)=>a+c.len,0)} characters in total)`);
  const awayT=g.away.reduce((a,x)=>a+x.secs,0);
  if(g.away.length)out.push(`Left the test page ${g.away.length} time${g.away.length>1?"s":""}, for ${mmss(awayT)} in total (longest ${mmss(Math.max(...g.away.map(x=>x.secs)))})`);
  return {list:out,pastes:g.pastes,copies:g.copies,away:g.away,awaySecs:awayT,ticketSecs:g.ticketSecs||{},triageSecs:g.triageSecs};
}
const mmss=s=>`${Math.floor((s||0)/60)}m ${String(Math.round((s||0)%60)).padStart(2,"0")}s`;
const norm=x=>String(x||"").replace(/\s+/g," ").trim().toLowerCase();
function draftUnchanged(t,a){return a.w==null||norm(a.w)===norm(t.draft);}
function proofResult(q,sel){
  sel=Array.isArray(sel)?sel:[];const err=Object.keys(q.errors).map(Number);
  const found=err.filter(k=>sel.includes(k)),missed=err.filter(k=>!sel.includes(k)),wrong=sel.filter(k=>!err.includes(k));
  const pts=!missed.length&&!wrong.length?2:(found.length>=err.length-1&&wrong.length<=1?1:0);
  return {pts,found,missed,wrong};
}
function scoreData(d){
  const order=d.order,set=d.set,n=order.length,A=d.answers||{},model=modelOrder(set);
  let dist=0;order.forEach((id,i)=>dist+=Math.abs(i-model.indexOf(id)));
  const maxDist=Math.floor(n*n/2);
  const rankScore=20*Math.max(0,1-dist/maxDist);
  let priPts=0;order.forEach(id=>{const t=ALL[id],v=d.pri[id];const a=PRI.indexOf(v),m=PRI.indexOf(t.pri);priPts+=v===t.pri?1:((t.alt||[]).includes(v)||Math.abs(a-m)===1)?0.5:0;});
  const prio=rankScore+10*priPts/n;
  const flags=[],traps=[],trapsAll=[],review=[];let jPts=0,jMax=0,cPts=0,cMax=0;
  for(const id of set){
    const t=ALL[id],ans=A[id];
    t.q.forEach((q,i)=>{if(q.cat==="w"){if(q.draft&&ans&&draftUnchanged(t,ans))flags.push(`${dn(id,d.num)}: Left the AI draft's mistake in the reply`);return;}
      if(q.cat==="p"){if(!trapsAll.includes(q.trap))trapsAll.push(q.trap);if(!ans)return;const pr=proofResult(q,ans[i]);
        if(pr.pts===2&&!traps.includes(q.trap))traps.push(q.trap);if(pr.missed.length)flags.push(`${dn(id,d.num)}: Missed ${pr.missed.length} error${pr.missed.length>1?"s":""} on the badge proof`);return;}
      const j=ans?ans[i]:null;const o=j!=null?q.o[j]:null;
      if(q.cat==="j"){jMax+=2;jPts+=o?o.pts:0;}
      if(q.cat==="a"){if(!trapsAll.includes(q.trap))trapsAll.push(q.trap);if(o&&o.trap&&!traps.includes(q.trap))traps.push(q.trap);}
      if(o&&o.flag)flags.push(`${dn(id,d.num)}: ${o.flag}`);});
    jMax+=2;
    if(ans&&ans.h==="o")review.push({id,text:ans.ho||""});else if(ans&&ans.h!=null&&t.h[ans.h])jPts+=t.h[ans.h][1];
  }
  for(const id of (d.arrived||[])){
    const t=ALL[id],ans=A[id];cMax+=4;
    const o=ans&&ans[0]!=null?t.q[0].o[ans[0]]:null;
    if(o){cPts+=o.pts;if(o.flag)flags.push(`${dn(id,d.num)}: ${o.flag}`);}
    if(ans&&ans.h==="o")review.push({id,text:ans.ho||""});else if(ans&&ans.h!=null&&t.h[ans.h])cPts+=t.h[ans.h][1];
  }
  if(d.cb1Shown||d.cb1!=null)cMax+=2;
  if(d.cb1!=null){const o=ALL[d.deadline].cb1.o[d.cb1];cPts+=o.pts;if(o.flag)flags.push("Phone message: "+o.flag);}
  const safetyRank=order.indexOf(d.safety)+1;if(safetyRank>4)flags.push(`Ranked the safety incident (${dn(d.safety,d.num)}) at ${safetyRank} of ${n}`);
  const accTotal=trapsAll.length||1;
  const parts={prio,acc:25*traps.length/accTotal,judg:jMax?25*jPts/jMax:0,adapt:cMax?20*cPts/cMax:0};
  const written=set.filter(id=>ALL[id].q.some(q=>q.cat==="w")).map(id=>{const t=ALL[id],a=A[id];return {id,text:a?(a.w!=null?a.w:(t.draft||"")):"",reached:!!a,draft:!!t.draft,unchanged:!!(a&&t.draft&&draftUnchanged(t,a))};});
  const signals=integritySignals(d);
  return {...d,signals,writtenAll:written,written:(written.find(w=>!w.draft)||{}).text||"",parts,total:parts.prio+parts.acc+parts.judg+parts.adapt,flags,traps,trapsAll,review};
}

function rawResult(){
  return {name:S.name,finishedAt:Date.now(),secs:Math.min(elapsed(),S.mins*60),mins:S.mins,order:[...S.order],pri:{...S.pri},
    answers:Object.fromEntries(S.done.map(id=>[id,S.answers[id]||{}])),seq:[...S.seq],integ:{pastes:S.integ.pastes,copies:S.integ.copies,away:S.integ.away,ticketSecs:S.integ.ticketSecs,triageSecs:S.integ.triageSecs},cb1:S.cb1,cb1Shown:S.cb1Shown,arrived:[...S.arrived],set:[...S.set],num:{...S.num},deadline:S.deadline,safety:S.safety,
    complete:S.queue.length>0&&S.queue.every(x=>S.done.includes(x))};
}
// Results code: lets a remote candidate send their answers when the page can't save them.
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16).padStart(8,"0");}
function encodeResult(raw){const j=JSON.stringify(raw);const b=btoa(unescape(encodeURIComponent(j)));return "TSG1-"+fnv("signal|"+j)+"-"+b;}
function decodeResult(code){
  const m=String(code).replace(/\s+/g,"").match(/^TSG1-([0-9a-f]{8})-([A-Za-z0-9+/=]+)$/);
  if(!m) throw new Error("That doesn't look like a results code. It should start with TSG1-.");
  let j;try{j=decodeURIComponent(escape(atob(m[2])));}catch(e){throw new Error("The code is incomplete. Ask the candidate to copy it again.");}
  if(fnv("signal|"+j)!==m[1]) throw new Error("The code has been changed or cut off. Ask the candidate to copy it again.");
  return JSON.parse(j);
}
async function finish(){
  if(S.stage==="done"||S.stage==="results")return;
  awayEnd();trackView();
  clearInterval(tick);closeModal();document.querySelectorAll(".toast").forEach(x=>x.remove());
  // answers on unsubmitted tickets don't count
  const raw=rawResult();S.code=encodeResult(raw);
  S.result=scoreData(raw);S.stage="done";S.saved=null;render();
  if(API_MODE){
    try{const res=await fetch("/api/results",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({raw,code:S.code,name:S.result.name,total:S.result.total,finishedAt:S.result.finishedAt,flags:S.result.flags.length,traps:`${S.result.traps.length}/${S.result.trapsAll.length}`,integ:S.result.signals?S.result.signals.list.length:null,parts:S.result.parts})});
      S.saved=res.ok;}catch(e){S.saved=false;}
    if(S.stage==="done")render();return;}
  if(!db){S.saved=false;render();return;}
  try{await db.collection("results").doc().set({...S.result,code:S.code});S.saved=true;S.result._saved=true;}catch(e){S.saved=false;}
  if(S.stage==="done")render();
}
render();
</script>
